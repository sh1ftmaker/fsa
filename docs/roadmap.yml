# Roadmap: the single source of truth for the progress website's quest path.
#
# Hand-maintained alongside docs/PLAN.md (which explains the why). Edit only
# the statuses (and add milestones) when a phase changes; tools/site_data.py
# computes each milestone's live progress from the honest report on every
# merge and writes site/data/roadmap.json.
#
# status: done | active | next | later
# hue: the phase gem's colour on the site: green, red, blue, purple or gold.
# covers: what a milestone works on, as treemap selectors:
#   <region>                  a whole region (game, jsystem, sdk, gx, runtime)
#   <region>:<library>        one library as the site names it (jsystem:J3D,
#                             runtime:MSL_C, game:THP, game:mg_* minigames)
# measure: how its progress is counted (optional; omit when it can't be
# measured from the report). `of` defaults to `covers`.
#   kind: code    matched bytes of code / all bytes of code
#   kind: fns     matched functions / all functions
#   kind: units   files flagged Matching / files split into units
#   kind: split   bytes of code in split units / all bytes of code
#   kind: linked  Matching units, all linking byte-identical (SHA-1), vs. all units
# landed: commit(s) on `matching` that finished it (optional).

policies:
  - id: no-fakematch
    title: No fakematches
    text: >-
      A function counts only when natural source compiles to the original
      bytes. Register pins, ordering tricks and asm stand-ins stay NonMatching
      with a FIXME saying what differs.
  - id: review
    title: Adversarial review of every submission
    text: >-
      A separate reviewer that never saw the author's reasoning judges names,
      types and readability (ACCEPT / CHANGES / REJECT); the gate checks the
      rest mechanically. Only ACCEPT merges.
  - id: honest
    title: Honest report plus SHA-1
    text: >-
      Every unit is diffed with relocations checked, and every merge links
      main.dol and checks its SHA-1. Byte-pattern hits and lenient diffs never
      count.

phases:
  - id: infra
    hue: gold
    title: Infrastructure and honest measurement
    status: done
    summary: Tools that measure the work without trusting it.
    milestones:
      - id: honest-report
        title: The honest objdiff report
        desc: Every unit diffed with relocations checked; report.json is never quoted.
        status: done
        covers: []
      - id: full-link
        title: main.dol links byte-identically
        desc: A plain ninja links every Matching unit and ends in the SHA-1 check.
        status: done
        covers: []
        measure: {kind: linked}
        landed: [0f24e19]
      - id: gate
        title: Submission gate and merge queue
        desc: tools/gate.py, adversarial review and coord.py's serial merges.
        status: done
        covers: []
        landed: [dc29090]
      - id: maps
        title: Library map and game file map
        desc: lib_map.tsv proposes every library file; tu_map.tsv finds 530 game files from .ctors, extab and float pools.
        status: done
        covers: []
        landed: [c3f69cc]
      - id: site
        title: This progress website
        desc: Regenerated from the honest report in every merge commit.
        status: done
        covers: []
        landed: [330f6aa]

  - id: sdk
    hue: blue
    title: Dolphin SDK and GX
    status: done
    summary: Every compiled SDK function matches; the last link and data fixes move to the leftovers phase.
    milestones:
      - id: sdk-units
        title: SDK from mkdd
        desc: OS, DVD, CARD, PAD, EXI, SI, VI and the rest, every function matched.
        status: done
        covers: [sdk]
        measure: {kind: code}
      - id: gx
        title: GX from oot-gc
        desc: The graphics library, file by file.
        status: done
        covers: [gx]
        measure: {kind: code}
      - id: sdk-leftovers
        title: SDK leftovers and GBA
        desc: gd, OdemuExi2, amcstubs, fstload, GXDisplayList, __start and GBA, imported from pikmin2.
        status: done
        covers: ["sdk:gba", "sdk:gd", "sdk:OdemuExi2", "sdk:amcstubs", "sdk:odenotstub"]
        measure: {kind: code}
        landed: [ade74ea]

  - id: libs
    hue: red
    title: JSystem waves and the pikmin2 imports
    status: done
    summary: The engine and the remaining libraries, donor-first, with pikmin2's GC/2.6 -O4,p builds.
    milestones:
      - id: jsystem-waves
        title: JSystem waves from mkdd
        desc: Per-unit agents on JKernel, JUtility, JAudio and JParticle, flags corrected to -O4,p.
        status: done
        covers: ["jsystem:JKernel", "jsystem:JUtility", "jsystem:JAudio", "jsystem:JParticle"]
        measure: {kind: code}
        landed: [9a69641]
      - id: trk
        title: MetroTRK v2.6
        desc: The debugger stub from pikmin2, all 30 units Matching.
        status: done
        covers: ["runtime:MetroTRK"]
        measure: {kind: code}
        landed: [34a9760]
      - id: jaudio-import
        title: JAudio new files and tails
        desc: JAISeMgr, JASHeapCtrl, JASAramStream and the other JAudio files mkdd lacks.
        status: done
        covers: ["jsystem:JAudio"]
        measure: {kind: code}
        landed: [17387e1]
      - id: j2d
        title: J2DGraph
        desc: The whole 2D library at -O4,p.
        status: done
        covers: ["jsystem:J2DGraph"]
        measure: {kind: code}
        landed: [78adb18]
      - id: msl
        title: MSL_C and Runtime
        desc: The Metrowerks C library and C++ runtime, 50 units Matching.
        status: done
        covers: ["runtime:MSL_C", "runtime:Runtime"]
        measure: {kind: code}
        landed: [39fc530]
      - id: jkernel-family
        title: JKernel family
        desc: New files and tails for JKernel, JUtility, JMessage, JParticle and JGadget.
        status: done
        covers: ["jsystem:JKernel", "jsystem:JUtility", "jsystem:JMessage", "jsystem:JParticle", "jsystem:JGadget"]
        measure: {kind: code}
        landed: [f8a4735]
      - id: j3d
        title: J3D
        desc: The 3D library from pikmin2, the biggest library left; the import is in review.
        status: done
        covers: ["jsystem:J3D"]
        measure: {kind: code}

  - id: leftovers
    hue: red
    title: Library leftovers and per-file grinding
    status: active
    summary: Take every library unit that is still NonMatching to Matching, one owner per file.
    milestones:
      - id: jsystem-grind
        title: JSystem file by file
        desc: Per-file agents on the JSystem units still NonMatching. JSystem is at 3605 of 3706 functions; 52 are still in no split unit (gap agent running) and about 49 are left in split files, about 30 of them register-allocation or fakematch holdouts (J3DMatBlock's word copies) kept honest with FIXMEs. Weak-data and dead-data map proofs landed.
        status: active
        covers: [jsystem]
        measure: {kind: units}
      - id: lib-fixes
        title: SDK, GX and MSL link fixes
        desc: The Dolphin SDK and GX are both 100 % and linked, GBAKey's DSP microcode extracted from the user's own main.dol at build time. Dead-stripped data is proven from the link map. Left are MSL ansi_fp/strtoul.
        status: active
        covers: [sdk, gx, runtime]
        measure: {kind: units}
      - id: thp
        title: THP video
        desc: The THP player in the game region (0x80427D2C), FSA's C++ port of the SDK sample player with sms's THPDec.c and THPAudio.c inside its unit, matched against tww's d_a_movie_player. 162 of 168 functions match; the six left differ only in register order and constant-pool order.
        status: active
        covers: ["game:THP"]
        measure: {kind: code}

  - id: game
    hue: green
    title: Game code
    status: active
    summary: FSA's own 3.4 MiB of C++, after the file map, the compiler setup and shared headers.
    milestones:
      - id: tu-splits
        title: The file map in splits.txt
        desc: 529 game units with their extab, .ctors and data ranges; 271 named from actors.tsv and a source-name string.
        status: done
        covers: [game]
        measure: {kind: split}
      - id: game-compiler
        title: Game compiler setup
        desc: GC/2.6 -O4,p, C++ exceptions, stmw on, fp_contract on, read-only strings; proven on five game functions and THP.
        status: done
        covers: [game]
      - id: shared-headers
        title: Shared headers, one owner each
        desc: "Done: ActorBase (19 slots, 52 members), ActorManager, Player, GameView, Effect, Map/collision, Camera, GameState, EnemyBase + SpriteAnim, Message, BgRewrite, GameMath (square()), one header per actor in include/game/act/. Remaining owners get headers as their files are written."
        status: done
        covers: [game]
      - id: generated
        title: Generated audio initialisers and destructors
        desc: tools/gen_game.py writes the 9-pool __sinit and simple actor destructors from one reviewed template, and the 152 player forwarders in tu_8022AD64 (bool/void/value variants, types read from callers); about 440 units, each checked by gen_game.py --check in the gate.
        status: done
        covers: [game]
      - id: wave-small
        title: "Wave 1: small files and minigames"
        desc: Small self-contained files and the mg_* minigames first. The first eight small game files are merged (all functions match; they reach Matching with the weak-dedup tooling).
        status: active
        covers: ["game:mg_* minigames"]
        measure: {kind: code}
      - id: wave-actors
        title: "Wave 2: actor families"
        desc: Enemies, NPCs and objects that share a base class. Twenty waves of six files are merged, one Sonnet agent per file and one reviewer per wave; 98 game units are Matching. Recurring shapes (square(), drawShadow(), the by-value message helper, TVec2f stack positions, box/position forms, early-return range checks, empty switch cases) are in the rules card.
        status: active
        covers: ["game:enemy_*_sob refs"]
        measure: {kind: code}
      - id: wave-systems
        title: "Wave 3: the big systems"
        desc: Player, map and HUD, messages and everything else in the game region.
        status: later
        covers: [game]
        measure: {kind: code}

  - id: names
    hue: purple
    title: The naming track
    status: active
    summary: Names with evidence only, reviewed on their own.
    milestones:
      - id: actor-table
        title: Actor table
        desc: English names for all 402 actor IDs, each citing in-game text, the wiki or stages.
        status: done
        covers: []
        landed: [f8f6612]
      - id: debug-strings
        title: Debug and assert strings
        desc: OSReport output, assert and crash-debugger strings tied to the functions that print them.
        status: next
        covers: [game]
      - id: dolphin
        title: Dolphin campaign
        desc: Debug output logged in Dolphin and the dormant debug menus, mapped to code.
        status: later
        covers: [game]

  - id: debt
    hue: gold
    title: Fakematch debt and crack passes
    status: later
    summary: Between waves, and the finish line.
    milestones:
      - id: crack
        title: Crack passes
        desc: Resistant functions with a stronger model and the permuter; the release-build-assert method for fakematch debt.
        status: later
        covers: []
        measure: {kind: fns, of: [game, jsystem, sdk, gx, runtime]}
      - id: finish
        title: Every unit Matching
        desc: All of main.dol built from source with the original SHA-1; a portable build becomes possible.
        status: later
        covers: []
        measure: {kind: code, of: [game, jsystem, sdk, gx, runtime]}
