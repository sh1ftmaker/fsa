# Roadmap: the single source of truth for the progress website's quest path.
#
# Hand-maintained alongside docs/PLAN.md and docs/GAME_PLAN.md (which explain
# the why). Edit the statuses (and add milestones) when a phase changes;
# tools/site_data.py computes each milestone's live progress from the honest
# report on every merge and writes site/data/roadmap.json.
#
# status: done | active | next | later
# focus: true on the one phase the site opens on and takes "Now"/"Next" from
#   (optional; without it the first active phase).
# hue: the phase gem's colour on the site: green, red, blue, purple or gold.
# covers: what a milestone works on, as treemap selectors:
#   <region>                  a whole region (game, jsystem, sdk, gx, runtime)
#   <region>:<library>        one library as the site names it (jsystem:J3D,
#                             runtime:MSL_C)
#   game:<part>               one part of the game code (tools/site_data.py
#                             GAME_PARTS): game:boot, game:battle (the boot
#                             path, docs/BOOT_PATH.md), game:actors, game:other
# measure: how its progress is counted (optional; omit when it can't be
# measured from the report). `of` defaults to `covers`.
#   kind: code    matched bytes of code / all bytes of code
#   kind: fns     matched functions / all functions
#   kind: units   files flagged Matching / files split into units
#   kind: split   bytes of code in split units / all bytes of code
#   kind: linked  Matching units, all linking byte-identical (SHA-1), vs. all units
# landed: commit(s) on `matching` that finished it (optional).
#
# Values are plain YAML scalars: quote any text that contains ": " or starts
# with a special character, or the Pages build fails to parse this file.

policies:
  - id: no-fakematch
    title: No fakematches
    text: >-
      A function counts only when natural source compiles to the original
      bytes. Register pins, ordering tricks and asm stand-ins stay NonMatching
      with a FIXME saying what differs; the few crack-pass exceptions are
      tagged and listed in docs/CRACK_PASS.md.
  - id: review
    title: Adversarial review of every submission
    text: >-
      A separate reviewer that never saw the author's reasoning judges names,
      types and readability (ACCEPT / CHANGES / REJECT); the gate checks the
      rest mechanically. Only ACCEPT merges.
  - id: honest
    title: Honest report plus SHA-1
    text: >-
      Every unit is diffed with relocations checked, and every merge links
      main.dol and checks its SHA-1. Byte-pattern hits and lenient diffs never
      count; partial credit appears only in the separately labelled weighted
      figure.

phases:
  - id: foundations
    hue: gold
    title: Foundations
    status: done
    summary: >-
      Measurement that does not trust the work, the file maps, the compiler
      setup and the shared game headers everything else builds on.
    milestones:
      - id: honest-report
        title: The honest objdiff report
        desc: Every unit diffed with relocations checked; report.json is never quoted.
        status: done
        covers: []
      - id: full-link
        title: main.dol links byte-identically
        desc: A plain ninja links every Matching unit and ends in the SHA-1 check.
        status: done
        covers: []
        measure: {kind: linked}
        landed: [0f24e19]
      - id: gate
        title: Gate, review and merge queue
        desc: tools/gate.py, the adversarial review and coord.py's serial merges.
        status: done
        covers: []
        landed: [dc29090]
      - id: file-map
        title: Library map and game file map
        desc: >-
          lib_map.tsv places every library file; tu_map.tsv found the game's
          files from .ctors, extab and float pools, now 528 game units in
          splits.txt with their data ranges.
        status: done
        covers: [game]
        measure: {kind: split}
        landed: [c3f69cc]
      - id: game-compiler
        title: Game compiler setup
        desc: GC/2.6 -O4,p, -inline auto,deferred, C++ exceptions, stmw on, fp_contract on, read-only strings; proven on the first game functions and THP.
        status: done
        covers: []
      - id: deferred-inlining
        title: Deferred inlining for game code
        desc: >-
          Game code builds with -inline auto,deferred, as the original did
          (vtables before jump tables in .data, later-defined functions
          inlined). Every game source lists its functions in descending address
          order; callees the original never inlines get an evidenced
          auto_inline region (docs/INLINING.md).
        status: done
        covers: []
      - id: shared-headers
        title: Shared game headers, one owner each
        desc: >-
          ActorBase, ActorManager, Player, GameView, Effect, Map and collision,
          Camera, GameState, EnemyBase and SpriteAnim, Message, BgRewrite,
          GameMath, and one header per actor in include/game/act/.
        status: done
        covers: []
      - id: generated
        title: Generated code
        desc: >-
          tools/gen_game.py writes the 9-pool audio __sinit, simple actor
          destructors and the player forwarders in tu_8022AD64 from reviewed
          templates (about 440 units), each checked by gen_game.py --check in
          the gate.
        status: done
        covers: []
      - id: site
        title: This progress website
        desc: Regenerated from the honest report in every merge commit.
        status: done
        covers: []
        landed: [330f6aa]

  - id: libraries
    hue: gold
    title: Libraries
    status: active
    summary: >-
      Donor-first imports from mkdd, oot-gc and pikmin2, then file by file.
      Everything is in; about fifty functions are left.
    milestones:
      - id: sdk-gx
        title: Dolphin SDK and GX
        desc: Every SDK and GX function matches and links, GBA and the SDK leftovers included.
        status: done
        covers: [sdk, gx]
        measure: {kind: code}
        landed: [ade74ea]
      - id: jsystem
        title: JSystem
        desc: JKernel, JUtility, JAudio, JParticle, J2DGraph, J3D, JMessage and the rest, imported and ground file by file at -O4,p.
        status: done
        covers: [jsystem]
        measure: {kind: code}
        landed: [9a69641, 78adb18, f8a4735]
      - id: msl-runtime-trk
        title: MSL, Runtime and MetroTRK
        desc: The Metrowerks C library, the C++ runtime and the debugger stub from pikmin2.
        status: done
        covers: [runtime]
        measure: {kind: code}
        landed: [39fc530, 34a9760]
      - id: lib-holdouts
        title: Library holdouts
        desc: >-
          About fifty JSystem functions that resist (register allocation and
          J3DMatBlock's word copies, kept honest with FIXMEs) and MSL's
          ansi_fp and strtoul. Most go to the crack pass.
        status: active
        covers: [jsystem, runtime]
        measure: {kind: fns}

  - id: game-method
    hue: blue
    title: "Game code: the method"
    status: active
    summary: >-
      How the game code gets written. Small functions first in waves, then
      big functions structure first, in boot-path order, with tools that
      find donor code and measure partial progress.
    milestones:
      - id: small-waves
        title: Waves of small-function units
        desc: >-
          One agent per file, one reviewer per wave. Actor waves, the ActorManager
          spawner (tu_801F9484, 322 functions) and many small units are merged;
          recurring shapes are in the rules card.
        status: active
        covers: [game]
        measure: {kind: fns}
      - id: grind
        title: Haiku grind
        desc: >-
          tools/grind.py on branch grind added about 650 small game functions,
          script-judged; an Opus review fixed about 200 and dropped 12 before
          the port to matching.
        status: done
        covers: []
      - id: boot-order
        title: Boot-path ordering
        desc: >-
          Dolphin execution coverage from power-on to a live Shadow Battle
          ranks the game files the game runs first (docs/BOOT_PATH.md). It sets
          the order of the work and the first two game parts on this site.
        status: done
        covers: [game:boot, game:battle]
      - id: metrics
        title: Structural and weighted measures
        desc: >-
          tools/structural.py counts functions that differ only in registers or
          order, and the weighted figure gives them partial credit. Both are
          shown apart from the honest numbers.
        status: done
        covers: []
        landed: [30dab99, 8854e48]
      - id: donor-leads
        title: Donor-lead preflight
        desc: tools/donor_leads.py fingerprints a unit and finds allowed donor code that resembles it before work starts.
        status: done
        covers: []
        landed: [f557227]
      - id: structure-first
        title: Big functions, structure first
        desc: >-
          Write a big function before it reaches 100 %, merge it when it is
          structurally done or close, so the literal pool, field offsets and
          callee names settle (docs/RULES_CARD.md). Just started on the file
          select, game mode screen and GBA link units.
        status: active
        covers: [game:boot]

  - id: game-parts
    hue: green
    title: "Game code: part by part"
    status: active
    focus: true
    summary: >-
      The 3.4 MiB of FSA's own code, in the order the game runs it. The
      boot path first, then the actors and everything else.
    milestones:
      - id: boot
        title: Boot to main menu
        desc: >-
          main(), the framework, the THP movie player (162 of 168 functions),
          the title screen and the screens built at boot (file select, the
          game mode screen, the GBA link manager).
        status: active
        covers: [game:boot]
        measure: {kind: code}
      - id: battle
        title: Main menu to Shadow Battle
        desc: Stage load, the players, the field and the actors on it, up to two Links fighting on The Field.
        status: active
        covers: [game:battle]
        measure: {kind: code}
      - id: screens
        title: Screens and menus
        desc: The remaining screens, HUD and menus, after their boot-path owners are written.
        status: next
        covers: []
      - id: actors
        title: Actors by family
        desc: >-
          Enemies, NPCs and objects family by family, sharing base classes and
          headers. The earlier actor waves matched the small ones; most
          update and init functions are still ahead.
        status: next
        covers: [game:actors]
        measure: {kind: code}
      - id: player
        title: The player
        desc: The Link class and the per-player queries, after the boot path has fixed its layout.
        status: next
        covers: []
      - id: map
        title: Map and stage
        desc: Rooms, collision, background rewrites and the stage loader.
        status: next
        covers: []
      - id: rest
        title: Everything else
        desc: Systems, minigames and the files no one has identified yet.
        status: later
        covers: [game:other]
        measure: {kind: code}

  - id: finish
    hue: purple
    title: Crack pass, names and the finish
    status: later
    summary: >-
      The resistant remainder with stronger models, evidence-based names, and
      the whole DOL built from source.
    milestones:
      - id: crack
        title: Crack pass
        desc: >-
          Resistant functions with a stronger model and the permuter. A trick is
          allowed only for a hard blocker, tagged FAKEMATCH(crack-pass) and
          listed in docs/CRACK_PASS.md.
        status: later
        covers: []
        measure: {kind: fns, of: [game, jsystem, sdk, gx, runtime]}
      - id: open-questions
        title: Open questions
        desc: >-
          Literals pooled before their first use, the save-data layout and
          the units out of address order (docs/CRACK_PASS.md, Open questions).
          Inlining of later-defined functions and the vtable / jump-table order
          were answered by deferred inlining (docs/INLINING.md).
        status: later
        covers: []
      - id: actor-table
        title: Actor table
        desc: English names for all 402 actor IDs, each citing in-game text, the wiki or stages.
        status: done
        covers: []
        landed: [f8f6612]
      - id: names
        title: The naming track
        desc: >-
          Real names for game files, classes and functions, from debug and
          assert strings, Dolphin debug output and the dormant debug menus,
          reviewed on their own.
        status: later
        covers: []
      - id: every-unit
        title: Every unit Matching
        desc: All of main.dol built from source with the original SHA-1; a portable build becomes possible.
        status: later
        covers: []
        measure: {kind: code, of: [game, jsystem, sdk, gx, runtime]}
